name: OpenTelemetry
on:
  workflow_run:
    workflows:
      - .github/workflows/copilot-setup-steps.yml
      - Autoversion
      - Build and Publish MCP Containers
      - Claude
      - CodeQL
      - Copilot cloud agent
      - Copilot code review
      - Copilot coding agent
      - Dependency Graph
      - OpenAI Codex
      - Recompile Agentic Workflows
      - Renovate
    types:
      - completed
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: plengauer/opentelemetry-github/actions/instrument/workflow@571cbe85f925e8ba395a5fca68f47ef9c536106c # v5.60.0
        env:
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}
          OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
    container: ghcr.io/plengauer/opentelemetry-github-workflow-instrumentation-runner:v5.60.0
    permissions:
      actions: read
