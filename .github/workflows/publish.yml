name: Build and Publish MCP Containers

on:
  push:
    branches: [main]
  pull_request:

jobs:
  setup-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: plengauer/opentelemetry-github/actions/instrument/job@db7b5a16bf2d905493c86f582aba4bb056d8aada # v5.62.1
        env:
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}
          OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
        with:
          secrets_to_redact: ${{ github.token }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: matrix
        run: |
          pip install --quiet pyyaml==6.0.2
          python3 -c "
          import yaml, json
          with open('apis.yml') as f:
              data = yaml.safe_load(f)
          print('matrix=' + json.dumps({'include': data['apis']}))
          " >> $GITHUB_OUTPUT
    permissions:
      actions: read
  build:
    runs-on: ubuntu-latest
    needs: [setup-matrix]
    strategy:
      matrix: ${{ fromJson(needs.setup-matrix.outputs.matrix) }}
    steps:
      - uses: plengauer/opentelemetry-github/actions/instrument/job@db7b5a16bf2d905493c86f582aba4bb056d8aada # v5.62.1
        env:
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}
          OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
        with:
          secrets_to_redact: ${{ github.token }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: openapi
        if: matrix.type == 'rest' && matrix.openapi_spec_url
        env:
          OPENAPI_SPEC_URL: ${{ matrix.openapi_spec_url }}
        run: |
          python3 scripts/prepare-openapi-spec.py "$OPENAPI_SPEC_URL" openapi/openapi.json
          echo "path=/app/openapi/openapi.json" >> "$GITHUB_OUTPUT"
      - id: graphql_schema
        if: matrix.type == 'graphql' && startsWith(matrix.base_url, 'https://api.github.com/')
        env:
          GRAPHQL_URL: ${{ matrix.base_url }}
          GRAPHQL_TOKEN: ${{ github.token }}
        run: |
          pip install --quiet graphql-core==3.2.12
          python3 .github/scripts/fetch-graphql-schema.py graphql-schema/introspection.json
          echo "path=/app/graphql-schema/introspection.json" >> "$GITHUB_OUTPUT"
      - id: config
        run: |
          if [ "${{ matrix.type }}" = "graphql" ]; then
            echo "dockerfile=Dockerfile.graphql" >> $GITHUB_OUTPUT
            {
              echo 'build_args<<EOF'
              echo 'API_MCP_SERVER_NAME=${{ matrix.server_name }}'
              echo 'API_MCP_BASE_URL=${{ matrix.base_url }}'
              echo 'API_MCP_GRAPHQL_SCHEMA_PATH=${{ steps.graphql_schema.outputs.path }}'
              echo 'EOF'
            } >> $GITHUB_OUTPUT
          else
            echo "dockerfile=Dockerfile.rest" >> $GITHUB_OUTPUT
            {
              echo 'build_args<<EOF'
              echo 'API_MCP_SERVER_NAME=${{ matrix.server_name }}'
              echo 'API_MCP_BASE_URL=${{ matrix.base_url }}'
              echo 'API_MCP_OPENAPI_SPEC_PATH=${{ steps.openapi.outputs.path }}'
              echo 'EOF'
            } >> $GITHUB_OUTPUT
          fi
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ${{ steps.config.outputs.dockerfile }}
          load: true
          push: false
          tags: mcp-${{ matrix.name }}:latest
          build-args: ${{ steps.config.outputs.build_args }}
      - run: docker save mcp-${{ matrix.name }}:latest -o /tmp/image.tar
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: image-${{ matrix.name }}
          path: /tmp/image.tar
    permissions:
      actions: read
  test:
    runs-on: ubuntu-latest
    needs: [setup-matrix, build]
    strategy:
      matrix: ${{ fromJson(needs.setup-matrix.outputs.matrix) }}
    steps:
      - uses: plengauer/opentelemetry-github/actions/instrument/job@db7b5a16bf2d905493c86f582aba4bb056d8aada # v5.62.1
        env:
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}
          OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
        with:
          secrets_to_redact: |-
            ${{ github.token }}
            ${{ secrets.GITHUB_TOKEN }}
          __kill_switch: 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: image-${{ matrix.name }}
          path: /tmp
      - run: docker load -i /tmp/image.tar
      - run: docker run -d --name mcp-test -p 8080:8080 mcp-${{ matrix.name }}:latest
      - run: |
          python3 -c "
          import socket, time, sys
          for _ in range(60):
              try:
                  socket.create_connection(('localhost', 8080), 1).close()
                  sys.exit(0)
              except OSError:
                  time.sleep(2)
          sys.exit(1)
          "
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - run: pip install -r tests/requirements.txt
      - env:
          MCP_URL: http://localhost:8080/mcp?authorization=Bearer+${{ secrets.GITHUB_TOKEN }}
        run: pytest tests/test_mcp.py -v
      - if: matrix.type == 'graphql' && startsWith(matrix.base_url, 'https://api.github.com/')
        run: docker logs mcp-test 2>&1 | grep -F 'MCP built eagerly from baked schema'
      - if: always()
        run: docker logs mcp-test && docker stop mcp-test
    permissions:
      actions: read
  test-github:
    runs-on: ubuntu-latest
    needs: [build]
    strategy:
      matrix:
        include:
          - name: rest
          - name: graphql
    steps:
      - uses: plengauer/opentelemetry-github/actions/instrument/job@db7b5a16bf2d905493c86f582aba4bb056d8aada # v5.62.1
        env:
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}
          OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
        with:
          secrets_to_redact: |-
            ${{ github.token }}
            ${{ secrets.GITHUB_TOKEN }}
          __kill_switch: 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: image-github-${{ matrix.name }}
          path: /tmp
      - run: docker load -i /tmp/image.tar
      - run: docker run -d --name mcp-test-github -p 8080:8080 mcp-github-${{ matrix.name }}:latest
      - run: |
          python3 -c "
          import socket, time, sys
          for _ in range(120):
              try:
                  socket.create_connection(('localhost', 8080), 1).close()
                  sys.exit(0)
              except OSError:
                  time.sleep(2)
          sys.exit(1)
          "
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - run: pip install -r tests/requirements.txt
      - env:
          MCP_URL: http://localhost:8080/mcp?authorization=Bearer+${{ secrets.GITHUB_TOKEN }}
          MCP_STDIO_IMAGE: mcp-github-${{ matrix.name }}
        run: pytest tests/test_github.py -v
      - if: always()
        run: docker logs mcp-test-github && docker stop mcp-test-github
    permissions:
      actions: read
  test-all:
    if: ${{ always() }}
    runs-on: ubuntu-latest
    needs: [ test, test-github ]
    permissions:
      actions: read
    steps:
      - uses: plengauer/opentelemetry-github/actions/instrument/job@db7b5a16bf2d905493c86f582aba4bb056d8aada # v5.62.1
        env:
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}
          OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
        with:
          secrets_to_redact: ${{ github.token }}
      - if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: exit 1          
  publish:
    runs-on: ubuntu-latest
    needs: [setup-matrix, test-all]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      matrix: ${{ fromJson(needs.setup-matrix.outputs.matrix) }}
    permissions:
      packages: write
      actions: read
    steps:
      - uses: plengauer/opentelemetry-github/actions/instrument/job@db7b5a16bf2d905493c86f582aba4bb056d8aada # v5.62.1
        env:
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}
          OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
        with:
          secrets_to_redact: |-
            ${{ github.token }}
            ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: image-${{ matrix.name }}
          path: /tmp
      - run: docker load -i /tmp/image.tar
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          docker tag mcp-${{ matrix.name }}:latest ghcr.io/${{ github.repository_owner }}/mcp-${{ matrix.name }}:latest
          docker push ghcr.io/${{ github.repository_owner }}/mcp-${{ matrix.name }}:latest
